<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmulatorJS – DS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }

    #preload {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #09090b; color: #e4e4e7;
      gap: 1rem; z-index: 10;
    }
    #preload.hidden { display: none; }
    #preload h2 { font-size: 1rem; font-weight: 600; color: #a78bfa; }
    #preload p  { font-size: 0.8rem; color: #71717a; }
    .bar-wrap { width: min(320px, 80vw); height: 6px; background: #27272a; border-radius: 9999px; overflow: hidden; }
    .bar-fill  { height: 100%; background: #7c3aed; border-radius: 9999px; transition: width 0.15s ease; width: 0%; }

    #error-screen {
      display: none; position: fixed; inset: 0;
      align-items: center; justify-content: center;
      background: #09090b; color: #f87171;
      font-family: monospace; padding: 2rem; text-align: center;
      flex-direction: column; gap: 0.75rem;
    }
    #error-screen.visible { display: flex; }
    #game { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="preload">
    <h2 id="preload-title">Chargement…</h2>
    <div class="bar-wrap"><div class="bar-fill" id="bar"></div></div>
    <p id="preload-sub"></p>
  </div>
  <div id="error-screen"><span style="font-size:2rem">⚠</span><span id="error-msg"></span></div>
  <div id="game"></div>

  <script>
    // ── Logger persistant (survit aux reloads) ─────────────────────────
    function elog(msg) {
      const key = 'emuste_log';
      try {
        const arr = JSON.parse(localStorage.getItem(key) || '[]');
        arr.push('[' + new Date().toISOString().slice(11,23) + '] ' + msg);
        if (arr.length > 40) arr.splice(0, arr.length - 40);
        localStorage.setItem(key, JSON.stringify(arr));
      } catch(e) {}
      window.parent?.postMessage({ type: 'ejs_debug', level: 'log', msg }, '*');
    }
    window.onerror = function(msg, src, line) {
      elog('ERROR ' + msg + ' @ ' + src + ':' + line);
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      elog('UNHANDLED REJECTION: ' + String(e.reason));
    });
    const _origReload = window.location.reload.bind(window.location);
    window.location.reload = function() {
      elog('RELOAD CALLED — stack: ' + new Error().stack?.split('\n')[1]);
      _origReload();
    };

    const params       = new URLSearchParams(window.location.search);
    const romUrl       = params.get('rom');
    const saveUrl      = params.get('save');
    const batterySaveUrl = params.get('batterySave');
    const romId        = params.get('romId');
    const romFileName  = params.get('romFileName');
    const sbUrl        = params.get('supabase');
    const chunkCount   = parseInt(params.get('chunks') || '1', 10);

    const preload      = document.getElementById('preload');
    const bar          = document.getElementById('bar');
    const preloadSub   = document.getElementById('preload-sub');
    const preloadTitle = document.getElementById('preload-title');
    const errorScreen  = document.getElementById('error-screen');

    function showError(msg) {
      preload.classList.add('hidden');
      errorScreen.classList.add('visible');
      document.getElementById('error-msg').textContent = msg;
    }
    function setProgress(done, total) {
      bar.style.width = `${Math.round((done / total) * 100)}%`;
      preloadSub.textContent = `${done} / ${total} blocs téléchargés`;
    }
    function setStep(msg) {
      preloadTitle.textContent = msg;
      preloadSub.textContent = '';
      bar.style.width = '100%';
    }

    // ── Téléchargement des chunks ROM ──────────────────────────────────
    async function downloadChunks(count, concurrency = 6) {
      const urls    = Array.from({ length: count }, (_, i) =>
        `${sbUrl}/storage/v1/object/public/roms/${romId}/chunk_${String(i).padStart(4, '0')}`
      );
      const results = new Array(count);
      let next = 0, done = 0;
      async function worker() {
        while (next < count) {
          const i = next++;
          const resp = await fetch(urls[i]);
          if (!resp.ok) throw new Error(`Bloc ${i} introuvable (${resp.status})`);
          results[i] = await resp.arrayBuffer();
          done++;
          setProgress(done, count);
        }
      }
      await Promise.all(Array.from({ length: Math.min(concurrency, count) }, worker));
      return results;
    }

    // ── IndexedDB helpers ──────────────────────────────────────────────

    function openSavesDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('/data/saves');
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('FILE_DATA')) {
            const store = db.createObjectStore('FILE_DATA');
            store.createIndex('timestamp', 'timestamp', { unique: false, multiEntry: false });
          }
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = () => reject(req.error);
      });
    }

    /** Injecte le battery save Supabase dans l'IDB avant le boot d'EmulatorJS */
    async function injectBatterySave() {
      if (!batterySaveUrl || !romFileName) return;
      try {
        const resp = await fetch(batterySaveUrl, { cache: 'no-store' });
        if (!resp.ok) return; // pas encore de save cloud, c'est normal
        const data = new Uint8Array(await resp.arrayBuffer());
        if (data.length < 100) return; // sanity check

        const baseName = romFileName.replace(/\.nds$/i, '');
        const savPath  = `/data/saves/${baseName}.sav`;
        const now      = new Date();

        const db = await openSavesDB();
        await new Promise((resolve, reject) => {
          const tx    = db.transaction('FILE_DATA', 'readwrite');
          const store = tx.objectStore('FILE_DATA');
          store.put({ timestamp: now, mode: 16872 }, '/data/saves/');
          store.put({ timestamp: now, mode: 33206, contents: data }, savPath);
          tx.oncomplete = resolve;
          tx.onerror    = () => reject(tx.error);
        });
        console.log('[Emuste] Battery save injecté :', savPath, `(${data.length} bytes)`);
      } catch (err) {
        console.warn('[Emuste] injectBatterySave failed:', err);
      }
    }

    /** Lit le .sav depuis l'IDB et le poste au parent (transferable) */
    async function syncBatteryToCloud() {
      try {
        const db = await openSavesDB();
        const entries = await new Promise((resolve, reject) => {
          const results = [];
          const cursor  = db.transaction('FILE_DATA', 'readonly')
            .objectStore('FILE_DATA').openCursor();
          cursor.onsuccess = e => {
            const c = e.target.result;
            if (c) { results.push({ key: c.key, value: c.value }); c.continue(); }
            else resolve(results);
          };
          cursor.onerror = () => reject(cursor.error);
        });

        // Cherche le fichier .sav avec de vraies données (> 100 bytes)
        const savEntry = entries.find(e => {
          if (typeof e.key !== 'string' || !e.key.endsWith('.sav')) return false;
          const c = e.value?.contents;
          if (!c) return false;
          const len = c instanceof Uint8Array
            ? c.length
            : Object.keys(c).filter(k => !isNaN(k)).length;
          // Exclut le contenu "undefined" (9 bytes)
          return len > 100;
        });

        if (!savEntry) return;

        const raw = savEntry.value.contents;
        let data;
        if (raw instanceof Uint8Array) {
          data = raw;
        } else {
          // Reconstitue depuis l'objet clé:valeur (format Firefox)
          const keys = Object.keys(raw).filter(k => !isNaN(k)).sort((a,b) => +a - +b);
          data = new Uint8Array(keys.length);
          keys.forEach(k => { data[+k] = raw[k]; });
        }

        if (data.length < 100) return;

        // Transfert zéro-copie vers le parent
        const buffer = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
        window.parent.postMessage({ type: 'ejs_battery_save', data: buffer }, '*', [buffer]);
      } catch (err) {
        console.warn('[Emuste] syncBatteryToCloud failed:', err);
      }
    }

    // ── Point d'entrée ─────────────────────────────────────────────────
    async function init() {
      elog('init() start — romId=' + romId + ' chunks=' + chunkCount);
      if (!romUrl && (!romId || !sbUrl)) { showError('Aucune ROM spécifiée.'); return; }

      // 1. Téléchargement des chunks ROM
      let gameUrl;
      if (chunkCount <= 1) {
        gameUrl = romUrl;
        elog('ROM url directe');
      } else {
        preloadTitle.textContent = 'Téléchargement de la ROM…';
        setProgress(0, chunkCount);
        try {
          const buffers = await downloadChunks(chunkCount);
          const blob = new Blob(buffers, { type: 'application/octet-stream' });
          gameUrl = URL.createObjectURL(blob);
          elog('ROM chunks assemblés OK — ' + buffers.length + ' blocs');
        } catch (err) { showError('Erreur : ' + err.message); return; }
      }

      // 2. Injection du battery save cloud dans l'IDB (avant le boot EmulatorJS)
      setStep('Chargement de la sauvegarde…');
      elog('injectBatterySave start');
      await injectBatterySave();
      elog('injectBatterySave done');

      preload.classList.add('hidden');

      // ── Config EmulatorJS ──────────────────────────────────────────
      let cachedState = null;

      window.EJS_player        = '#game';
      window.EJS_core          = 'melonds';
      window.EJS_gameUrl       = gameUrl;
      window.EJS_pathtodata    = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_defaultOptions = { 'directBoot': 'enabled' };
      window.EJS_Buttons = {
        playPause: true, restart: true, mute: true, settings: true,
        fullscreen: true, saveState: true, loadState: true,
        screenRecord: false, gamepad: true, cheat: false, volume: true,
        saveSavFiles: true, loadSavFiles: true,
      };

      elog('EJS config — saveUrl=' + (saveUrl ? 'yes' : 'no') + ' batterySaveUrl=' + (batterySaveUrl ? 'yes' : 'no'));
      if (saveUrl) window.EJS_saveStateURL = saveUrl;

      // Save STATE (snapshot) → upload cloud via parent
      window.EJS_onSaveState = function(e) {
        try {
          const raw = e.state instanceof Uint8Array ? e.state : new Uint8Array(e.state);
          cachedState = raw.slice();
          const transfer = raw.buffer.slice(raw.byteOffset, raw.byteOffset + raw.byteLength);
          window.parent.postMessage(
            { type: 'ejs_save_state', state: transfer, screenshot: e.screenshot || null },
            '*', [transfer]
          );
        } catch (err) { console.error('[Emuste] save state error:', err); }
      };

      // Load STATE → cache session ou fetch Supabase
      window.EJS_onLoadState = async function() {
        if (cachedState) return cachedState;
        if (!romId || !sbUrl) return null;
        try {
          const resp = await fetch(
            `${sbUrl}/storage/v1/object/public/saves/${romId}/auto.state?t=${Date.now()}`,
            { cache: 'no-store' }
          );
          if (!resp.ok) return null;
          cachedState = new Uint8Array(await resp.arrayBuffer());
          return cachedState;
        } catch { return null; }
      };

      window.addEventListener('message', ev => {
        if (ev.data?.type === 'ejs_force_load' && window.EJS_emulator && ev.data.state) {
          try { window.EJS_emulator.gameManager.loadState(new Uint8Array(ev.data.state)); }
          catch (err) { console.error('[Emuste] force_load error:', err); }
        }
      });

      elog('EmulatorJS script loading…');

      // ── Sync battery save automatique ────────────────────────────
      setTimeout(syncBatteryToCloud, 5000);
      // Sync toutes les 60 secondes pendant la session
      setInterval(syncBatteryToCloud, 60 * 1000);
      // Sync au déchargement de la page (best-effort)
      window.addEventListener('pagehide', syncBatteryToCloud);

      const script = document.createElement('script');
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      script.onerror = () => showError('Impossible de charger EmulatorJS. Vérifiez votre connexion.');
      document.body.appendChild(script);
    }

    init().catch(err => showError(err.message));
  </script>
</body>
</html>
